<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PriceWatch — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">Price<span>Watch</span></div>
    <div class="navbar-actions">
      <button class="btn-secondary btn-sm" id="simulate-btn">Simulate price check now</button>
      <button class="btn-secondary btn-sm" id="logout-btn">Log out</button>
    </div>
  </nav>

  <div class="page">
    <div class="card">
      <div class="card-header">
        <h3>Watch a new item</h3>
      </div>
      <form id="create-item-form">
        <div class="form-row">
          <div class="field">
            <label for="item-name">Name</label>
            <input type="text" id="item-name" placeholder="e.g. Wireless Headphones" required />
          </div>
          <div class="field">
            <label for="item-url">Product URL</label>
            <input type="url" id="item-url" placeholder="https://example.com/product" required />
          </div>
          <div class="field" style="max-width:160px;">
            <label for="item-target">Target price ($)</label>
            <input type="number" id="item-target" step="0.01" min="0.01" placeholder="99.99" required />
          </div>
        </div>
        <button type="submit" class="btn-primary" id="create-item-submit">Add item</button>
        <div class="error-text" id="create-item-error"></div>
      </form>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Your watched items</h3>
      </div>
      <div id="items-loading" class="loading-text">Loading items…</div>
      <div id="items-empty" class="empty-state" style="display:none;">
        You're not watching anything yet. Add an item above to get started.
      </div>
      <div id="item-grid" class="item-grid"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
